[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-trading"
version = "0.1.0"
description = "Local data-ingestion and storage components for quantitative trading research."
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
data-pipeline = "data_pipeline.cli:main"
quant-research = "research.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
markers = [
    "network: test that makes a live request to an external data provider",
]
